# retro-ipod-spotify-revival: installed by install/install.sh (WirePlumber 0.5, Trixie).
# The headphone-jack DAC runs its PLL from the I2S bit clock. Keep the clock running
# (no suspend when idle, which also avoids clicks) at 44.1 kHz, Spotify's rate.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*", alsa.card_name = "snd_rpi_rpi_dac" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        audio.rate = 44100
      }
    }
  }
]
